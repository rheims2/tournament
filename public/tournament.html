  </section>
  <section class="tl">${groups.map(([day, list]) => `
    ${day ? `<div class="tl-day"><span class="chip day">${esc(day)}</span><span class="r"></span></div>` : ''}
    ${list.map(m => {
      const home = m.a === sel.team
      const opp = home ? m.b : m.a
      const oppSrc = home ? m.bs : m.as
      const won = m.w && ((home && m.w === 'a') || (!home && m.w === 'b'))
      const lost = m.w && m.w !== 'split' && !won
      return `<div class="mrow${isNow(m) ? ' now' : ''}">
        <div class="when">${esc(m.t || '—')}${m.c ? `<small>Ct ${esc(m.c)}</small>` : ''}</div>
        <div>
          <div class="opp"><span class="lbl">${home ? 'home' : 'away'} vs</span>
            ${opp ? teamBtn(opp, m.div) : `<em style="color:var(--ink-3)">${esc(oppSrc || 'TBD')}</em>`}</div>
          <div class="meta">
            <span class="chip">${esc(m.stage)}</span>
            ${m.n ? `<span class="chip">Game #${esc(m.n)}</span>` : ''}
            ${isNow(m) ? '<span class="chip live">On now</span>' : ''}
            ${won ? '<span class="chip won">Won</span>' : ''}
            ${lost ? '<span class="chip lost">Lost</span>' : ''}
            ${m.w === 'split' ? '<span class="chip">Sets split</span>' : ''}
          </div>
          ${m.r ? `<div class="mono" style="font-size:12.5px;color:var(--ink-2);margin-top:5px">${esc(m.r)}</div>` : ''}
        </div>
      </div>`
    }).join('')}`).join('')}
  </section>`
}

/* The receipt: what each sheet returned and what was made of it. */
function pData() {
  const rawTable = grid => !grid?.length ? '<p class="sec-note">Nothing came back.</p>'
    : `<div class="tw raw"><table><tbody>${grid.slice(0, 200).map(r =>
        `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`

  const rows = sheets.map((s, i) => {
    const v = views[i] || {}
    const p = v.parsed
    let summary = '—'
    if (s.role === 'schedule' && p) {
      summary = `${p.length} day${p.length === 1 ? '' : 's'} of court grid`
    } else if (p) {
      const rounds = p.groups.reduce((n, g) => n + g.rounds.length, 0)
      summary = [
        p.pools.length ? `${p.pools.length} pool${p.pools.length === 1 ? '' : 's'}` : '',
        rounds ? `${rounds} bracket round${rounds === 1 ? '' : 's'}` : '',
        p.places ? `${p.places.length} placings` : '',
        p.unread.length ? `${p.unread.length} block${p.unread.length === 1 ? '' : 's'} not shown as games` : '',
      ].filter(Boolean).join(' · ') || 'nothing recognised'
    }
    return `<details class="card" style="margin-bottom:12px">
      <summary style="cursor:pointer;list-style:revert">
        <span class="srow" style="border:0;padding:0;display:inline-flex">
          <span class="nm">${esc(s.name || 'Sheet ' + (i + 1))}</span>
          <span class="chip">${esc(s.role)}</span>
          <span class="st ${esc(v.status || '')}">${esc(v.status || 'idle')}</span>
          <span class="sec-note">${esc(summary)}</span>
        </span>
      </summary>
      <div style="margin-top:12px">
        ${v.error ? `<div class="callout"><strong>Couldn't read this sheet.</strong> ${esc(v.error)}</div>` : ''}
        <p class="sec-note"><a href="${esc(s.url)}" target="_blank" rel="noopener">Open in Google Sheets ↗</a>
          ${v.fetchedAt ? ' · read ' + esc(new Date(v.fetchedAt).toLocaleTimeString()) : ''}</p>
        ${(p?.unread ?? []).map(b => `<div class="callout plain" style="margin-bottom:10px">
          <strong>${esc(b.title || 'Untitled block')}</strong> — not shown as games: ${esc(b.why)}
          ${rawTable(b.rows)}</div>`).join('')}
        ${rawTable(v.grid)}
      </div>
    </details>`
  }).join('')

  return `
  <section>
    <span class="eyebrow">Straight from Google</span>
    <h1 class="h-div">Data</h1>
    <p class="lede">Exactly what each sheet returned, and what the page made of it. If a division looks wrong,
      the answer is here — open the sheet below and compare.</p>
  </section>
  <section>${rows || '<p class="sec-note">No sheets configured.</p>'}</section>
  <section>
    <div class="sec-head"><h2 class="h-sec">Sheets</h2></div>
    <div class="setup">
      <p class="sec-note" style="margin:0 0 10px">One per line: <code>Name | role | link</code>.
        Role is <code>division</code> (the default), <code>schedule</code> or <code>raw</code>.
        Saved in this browser; <strong>Use built-in list</strong> goes back to what the file itself defines.</p>
      <textarea id="links" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn go" id="saveBtn" type="button">Save &amp; reload</button>
        <button class="btn" id="resetBtn" type="button">Use built-in list</button>
      </div>
      <p class="sec-note" style="margin-top:10px">Each sheet must be a real Google Sheet shared
        “Anyone with the link — Viewer”. A sheet with several tabs needs one line per tab, keeping the
        <code>#gid=…</code> Google puts in the URL when that tab is open.</p>
    </div>
  </section>`
}

/* ================================= shell ================================ */

function tabs() {
  const t = [{ id: 'myteam', label: 'My Team' }, { id: 'overview', label: 'Overview' }]
  if (model.schedule.length) t.push({ id: 'schedule', label: 'Court Schedule' })
  model.divisions.forEach(d => t.push({ id: d.id, label: d.tab || d.name, ct: d.teams.length || null }))
  if (model.divisions.some(d => d.teams.length)) t.push({ id: 'teams', label: 'Teams' })
  t.push({ id: 'data', label: 'Data' })
  return t
}

/** A division is fed by one or more tabs; the dot reflects the worst of them. */
function dotFor(id) {
  const st = sheets.map((s, i) => (s.div === id ? views[i]?.status : null)).filter(Boolean)
  if (st.includes('error')) return '<span class="dot error"></span>'
  if (st.includes('loading')) return '<span class="dot loading"></span>'
  return ''
}

function renderStamp() {
  const el = $('#stamp')
  if (!sheets.length) { el.innerHTML = ''; return }
  if (views.some(v => v.status === 'loading')) { el.innerHTML = 'Reading sheets…'; return }
  const times = views.map(v => v.fetchedAt).filter(Boolean)
  const bad = views.filter(v => v.status === 'error').length
  el.innerHTML = (times.length ? `Updated <b>${new Date(Math.min(...times)).toLocaleTimeString()}</b>` : '')
    + (bad ? ` <span class="bad">· ${bad} failed</span>` : '')
}

function render() {
  const list = tabs()
  if (!list.some(t => t.id === tab)) tab = 'overview'
  $('#rail').innerHTML = list.map(t =>
    `<button class="tab" role="tab" data-tab="${esc(t.id)}" aria-selected="${tab === t.id}">${esc(t.label)}`
    + `${t.ct ? `<span class="ct">${t.ct}</span>` : ''}${dotFor(t.id)}</button>`).join('')

  let html
  if (!sheets.length) html = pData()
  else if (tab === 'overview') html = pOverview()
  else if (tab === 'schedule') html = pSchedule()
  else if (tab === 'teams') html = pTeams()
  else if (tab === 'myteam') html = pMyTeam()
  else if (tab === 'data') html = pData()
  else html = pDivision(DIVBY()[tab])

  $('#panels').innerHTML = `<div class="panel" role="tabpanel">${html}</div>
    <div class="footer"><span>Read live from the tournament's Google Sheets.</span>
    <span>${views.filter(v => v.status === 'ok').length} of ${sheets.length} sheets reading cleanly</span></div>`

  if ($('#links')) $('#links').value = draft ?? store.get(STORE_SHEETS) ?? configText()
  $(`.tab[data-tab="${CSS.escape(tab)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
  renderStamp()
  buildPicker()
}

const configText = () => sheets.map(s => `${s.name || 'Sheet'} | ${s.role} | ${s.url}`).join('\n')

function buildPicker() {
  const p = $('#teamPick')
  const want = sel ? `${sel.div}::${sel.team}` : ''
  p.innerHTML = '<option value="">All teams</option>'
  model.divisions.forEach(d => {
    if (!d.teams.length) return
    const g = document.createElement('optgroup')
    g.label = d.name
    d.teams.forEach(t => {
      const o = document.createElement('option')
      o.value = `${d.id}::${t}`; o.textContent = t
      g.appendChild(o)
    })
    p.appendChild(g)
  })
  p.value = want
}

function pick(v, fromPicker) {
  sel = v ? { div: v.split('::')[0], team: v.split('::').slice(1).join('::') } : null
  if (sel && !fromPicker) tab = 'myteam'
  render()
}

/* ------------------------------- refresh -------------------------------- */

async function refresh() {
  if (!sheets.length) { render(); return }
  $('#refreshBtn').disabled = true
  views.forEach(v => { v.status = 'loading' })
  render()

  await Promise.all(sheets.map(async (sheet, i) => {
    const v = views[i]
    try {
      const data = await fetchTab(sheet)
      if (data?.status === 'error') {
        const e = data.errors?.[0]
        throw new Error(String(e?.detailed_message ?? e?.message ?? 'Google refused the request.')
          .replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim())
      }
      v.grid = toGrid(data?.table)
      v.parsed = sheet.role === 'schedule' ? parseSchedule(v.grid)
               : sheet.role === 'raw' ? null
               : parseSheet(v.grid, sheet.role === 'pool' || sheet.role === 'bracket' ? sheet.role : null)
      v.status = 'ok'; v.error = null; v.fetchedAt = Date.now()
    } catch (err) {
      v.status = 'error'; v.error = err.message || String(err); v.parsed = null
    }
  }))

  buildModel()
  $('#refreshBtn').disabled = false
  render()
}

function setAuto(sec) {
  clearInterval(timer); timer = null
  store.set(STORE_AUTO, String(sec))
  if (sec > 0) timer = setInterval(refresh, sec * 1000)
}

function applyConfig(next) {
  sheets = next.map((s, i) => ({
    ...s,
    key: `s${i}_${s.id.slice(0, 5)}${s.gid}`,
    div: 'div_' + ((norm(s.name) || `sheet${i}`).replace(/[^a-z0-9]+/g, '-')),
  }))
  views = sheets.map(() => ({ status: 'idle', grid: null, parsed: null, error: null, fetchedAt: null }))
  sel = null
  buildModel()
  render()
  if (sheets.length) refresh()
}

/* -------------------------------- events -------------------------------- */

document.addEventListener('click', e => {
  const t = e.target
  const tabBtn = t.closest('[data-tab]');     if (tabBtn) { tab = tabBtn.dataset.tab; render(); window.scrollTo(0, 0); return }
  const goto   = t.closest('[data-goto]');    if (goto)   { tab = goto.dataset.goto;  render(); window.scrollTo(0, 0); return }
  const dayBtn = t.closest('[data-day-btn]'); if (dayBtn) { schedDay = +dayBtn.dataset.dayBtn; render(); return }
  const team   = t.closest('[data-team]');    if (team)   { pick(team.dataset.team, false); return }
  if (t.closest('#saveBtn')) {
    const next = parseLines($('#links').value)
    if (!next.length) { alert('No Google Sheets links found.\nEach line needs a link like\nhttps://docs.google.com/spreadsheets/d/…'); return }
    store.set(STORE_SHEETS, $('#links').value)
    draft = null
    applyConfig(next)
    return
  }
  if (t.closest('#resetBtn')) { store.del(STORE_SHEETS); draft = null; applyConfig(loadConfig()); return }
})
document.addEventListener('input', e => { if (e.target.id === 'links') draft = e.target.value })
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return
  const team = e.target.closest?.('[data-team]')
  if (team) { e.preventDefault(); pick(team.dataset.team, false) }
})
$('#teamPick').addEventListener('change', e => pick(e.target.value, true))
$('#autoPick').addEventListener('change', e => setAuto(Number(e.target.value)))
$('#refreshBtn').addEventListener('click', refresh)
$('#printBtn').addEventListener('click', () => window.print())
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme')
  const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark')
})
// A phone that slept is showing old scores; catch it up on the way back.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && sheets.length && Number($('#autoPick').value) > 0) refresh()
})

const setBandH = () => document.documentElement.style.setProperty('--bandH', $('.band').offsetHeight + 'px')
addEventListener('resize', setBandH)

/* --------------------------------- boot --------------------------------- */

$('#mName').textContent = EVENT.name || 'Tournament'
$('#mYear').textContent = EVENT.year || ''
$('#mSub').textContent  = EVENT.sub || ''
document.title = EVENT.name ? `${EVENT.name} · Live` : 'Tournament Live'

const savedAuto = Number(store.get(STORE_AUTO) ?? '0')
$('#autoPick').value = String(savedAuto)
setAuto(savedAuto)

applyConfig(loadConfig())
setBandH()
// Keep "On now" honest without re-reading Google.
setInterval(() => { if (tab !== 'data' && model.all.some(m => startOf(m))) render() }, 60000)
})()
</script>
</body>
</html>
